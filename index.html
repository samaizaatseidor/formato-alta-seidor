<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formato de Alta 2026 — SEIDOR México</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #0F6E56; --green-light: #E1F5EE; --green-dark: #085041;
    --border: #e2e2e0; --bg: #f7f6f2; --card: #ffffff;
    --text: #1a1a18; --muted: #6b6b67; --danger: #A32D2D; --danger-light: #FCEBEB;
    --radius: 10px; --radius-sm: 6px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .logo { font-size: 15px; font-weight: 600; color: var(--green); letter-spacing: -0.01em; }
  .logo span { color: var(--muted); font-weight: 400; }
  
  .container { max-width: 820px; margin: 0 auto; padding: 32px 24px 80px; }
  
  .progress-wrap { margin-bottom: 28px; }
  .progress-steps { display: flex; align-items: center; gap: 0; }
  .p-step { display: flex; align-items: center; flex: 1; }
  .p-dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border); background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--muted); flex-shrink: 0; transition: all 0.2s; }
  .p-dot.active { border-color: var(--green); background: var(--green); color: #fff; }
  .p-dot.done { border-color: var(--green); background: var(--green-light); color: var(--green); }
  .p-line { flex: 1; height: 2px; background: var(--border); transition: background 0.2s; }
  .p-line.done { background: var(--green); }
  .p-labels { display: flex; margin-top: 6px; }
  .p-label { flex: 1; font-size: 10px; color: var(--muted); text-align: center; padding: 0 2px; }
  .p-label.active { color: var(--green); font-weight: 600; }
  
  .section-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 16px; }
  .section-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 16px; }
  
  .step-title { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .step-sub { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
  
  .grid { display: grid; gap: 14px; }
  .grid-2 { grid-template-columns: 1fr 1fr; }
  .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
  .full { grid-column: 1 / -1; }
  
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; font-weight: 500; color: var(--muted); }
  .field label .req { color: var(--danger); margin-left: 2px; }
  .field input, .field select, .field textarea {
    font-size: 14px; padding: 8px 11px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: #fafaf8; color: var(--text);
    transition: border-color 0.15s, box-shadow 0.15s; width: 100%;
    font-family: inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(15,110,86,0.1);
  }
  .field textarea { resize: vertical; min-height: 68px; line-height: 1.5; }
  
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .metric { background: #f7f6f2; border-radius: var(--radius-sm); padding: 12px 14px; border: 1px solid var(--border); }
  .metric-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .metric-val { font-size: 20px; font-weight: 600; }
  .metric-val.green { color: var(--green); }
  .metric-val.red { color: var(--danger); }
  
  .tbl-header { display: grid; gap: 8px; padding: 0 0 6px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
  .tbl-label { font-size: 11px; font-weight: 600; color: var(--muted); }
  .tbl-row { display: grid; gap: 8px; align-items: center; margin-bottom: 8px; }
  .cols-costo { grid-template-columns: 2.5fr 1fr 1fr 80px 80px 28px; }
  .cols-fac { grid-template-columns: 2fr 1fr 1fr 1fr; }
  .tbl-row input, .tbl-row select { font-size: 13px; padding: 6px 9px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fafaf8; color: var(--text); width: 100%; font-family: inherit; }
  .tbl-row input:focus, .tbl-row select:focus { outline: none; border-color: var(--green); }
  .row-margen { font-size: 13px; font-weight: 500; text-align: right; }
  
  .btn-remove { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border); background: transparent; cursor: pointer; color: var(--muted); font-size: 16px; display: flex; align-items: center; justify-content: center; line-height: 1; transition: all 0.15s; flex-shrink: 0; }
  .btn-remove:hover { background: var(--danger-light); color: var(--danger); border-color: #F09595; }
  .btn-add { background: none; border: none; color: var(--green); font-size: 13px; cursor: pointer; padding: 6px 0; margin-top: 4px; font-family: inherit; }
  .btn-add:hover { text-decoration: underline; }
  
  .hito-card { background: #fafaf8; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 10px; }
  .hito-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .hito-num { font-size: 12px; font-weight: 600; color: var(--muted); }
  
  .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
  .btn { padding: 9px 22px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--text); font-family: inherit; transition: all 0.15s; }
  .btn:hover { background: var(--bg); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--green); color: #fff; border-color: var(--green); }
  .btn-primary:hover { background: var(--green-dark); border-color: var(--green-dark); }
  .btn-export { background: var(--green); color: #fff; border-color: var(--green); padding: 11px 32px; font-size: 15px; }
  .btn-export:hover { background: var(--green-dark); }
  .step-counter { font-size: 13px; color: var(--muted); }
  
  .summary-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .summary-row:last-child { border-bottom: none; }
  .summary-key { color: var(--muted); }
  .summary-val { font-weight: 500; }
  
  .notice { background: var(--green-light); border: 1px solid #9FE1CB; border-radius: var(--radius-sm); padding: 12px 16px; font-size: 13px; color: var(--green-dark); margin-bottom: 16px; }
  .notice strong { font-weight: 600; }

  .ebm-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
  .badge-opt { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #f0efe8; color: var(--muted); margin-left: 8px; vertical-align: middle; }

  @media (max-width: 600px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .full { grid-column: 1; }
    .metrics { grid-template-columns: 1fr; }
    .cols-costo { grid-template-columns: 1fr 1fr 1fr; }
    header { padding: 12px 16px; }
    .container { padding: 20px 14px 60px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">SEIDOR México <span>/ Formato de Alta 2026</span></div>
  <div style="font-size:12px; color:var(--muted);" id="header-cliente"></div>
</header>

<div class="container">
  <div class="progress-wrap">
    <div class="progress-steps" id="progress-steps"></div>
    <div class="p-labels" id="progress-labels"></div>
  </div>
  <div id="step-content"></div>
</div>

<script>
const STEPS = ['Cliente','Proyecto','Responsables','Costos','Facturación','Resumen'];
const EJECUTIVOS = ['','ARACELIS PEÑALOZA','CESAR MONTERO','ROGELIO LEYVA','SERGIO OBREGÓN','ARMANDO MIRANDA'];
const GERENTES = ['','ARACELIS PEÑALOZA','CESAR MONTERO','ROGELIO LEYVA','SERGIO OBREGÓN'];
const DIR_OPS = ['','CESAR MONTERO','CESAR CALLEJA'];
const DIVISIONES = ['','D2 CONSULTING - ERP S4 HANA','D3 BYD','D4 PUBLIC','D8 HXM SFSF','D9 CIBERSEGURIDAD','D11 HADW &SOFT','D12 WORKPLACE','D13 CX - COES','D14 AWS - AZURE - CLOUD','D15 CLOUD B1 - HOSTING','D16 B1','D17 ANALYTICS','D19 PRODUCTOS Y ADDONS SEIDOR','D20 AMS - MESA DE AYUDA S4 HANA','D30 STAFFING S4 HANA','D31 AMS SFSF','D32 STAFFING SFSF','D33 ARIBA - CONCUR','D34 STAFFING NO SAP'];
const EMPRESAS = ['SEIDOR MEXICO','SEIDOR ESPAÑA','SEIDOR ARGENTINA','SEIDOR EU','SEIDOR CHILE','SEIDOR PERÚ'];
const MONEDAS = ['USD','MXN','EUR'];
const TIPOS_FAC = ['','SERVICIOS DE CONSULTORÍA EN IMPLEMENTACIÓN, CAPACITACIÓN Y/O ATM','SERVICIOS DE CONSULTORÍA MESA DE AYUDA (HELP DESK)','SUSCRIPCIONES, MANTENIMIENTOS Y LICENCIAS DE ADDONS','LICENCIAMIENTO (SAP-BYD-B1-MICROSOFT)','SUSCRIPCIONES (LICENCIAMIENTO CLOUD)','MANTENIMIENTO AL LICENCIAMIENTO','CLOUD Y HOSTING','EQUIPOS Y HARDWARE','OTRO'];
const COND_PAGO = ['15 DÍAS','30 DÍAS','45 DÍAS','60 DÍAS','ANTICIPO','CONTADO'];
const RECURRENCIA = ['CUOTA ÚNICA','MENSUAL','TRIMESTRAL','SEMESTRAL','ANUAL','OTRO (ESPECÍFICA)'];
const RESPONSABLES_COE = ['','ANAMARIA SILVA','ESTEFANIA MUÑOZ','FERNANDA RICHARDS','FREDA JUÁREZ','LAURA MARTINEZ','MANUEL APON','NATALIA OSSA','VERONICA NORIEGA'];

let current = 0;
let D = {
  id_op_crm:'', tiene_pep:'NO', pep:'',
  cliente: { nombre_comercial:'', razon_social:'', rfc:'', direccion:'', localidad:'NACIONAL', contacto_lider:'', telefono1:'', correo1:'', contacto_cp:'', telefono2:'', correo2:'', solicita_odc:'NO', portal:'N/A', contrasena:'N/A', proceso_fac:'Las facturas se envían a los correos mencionados.' },
  proyecto: { nombre:'', version:'', fecha_inicio:'', fecha_fin:'', empresa:'SEIDOR MEXICO', intercompany:'', responsable_coe:'', moneda:'USD', tc_usd:'18', tc_ref:'1' },
  responsables: { director:'PAUL RICHARD SIRRS DIAZ', dir_ops:'', gerente:'', division:'', ejecutivo:'' },
  costos: [newCostoRow()],
  facturacion: [newFacRow()],
  ebm: { hay_ebm:'NO', razon_social:'', pct_comision:'', moneda_pago:'USD' },
  obs_fac:''
};

function newCostoRow() { return { concepto:'', costo_unitario:'', venta_unitaria:'', dias:'' }; }
function newFacRow() { return { descripcion:'', tipo:'', division:'', moneda:'USD', importe:'', fecha:'', recurrencia:'CUOTA ÚNICA', cond_pago:'30 DÍAS' }; }

function opt(arr, sel) { return arr.map(v=>`<option value="${v}"${v===sel?' selected':''}>${v||'— selecciona —'}</option>`).join(''); }
function fmt(n, m) { if(!n||isNaN(n)) return '—'; return '$'+parseFloat(n).toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:0})+' '+(m||''); }

function calcTotals() {
  let tv=0, tc=0;
  D.costos.forEach(r=>{ tv+=(parseFloat(r.venta_unitaria)||0)*(parseFloat(r.dias)||0); tc+=(parseFloat(r.costo_unitario)||0)*(parseFloat(r.dias)||0); });
  return { tv, tc, mg: tv-tc, pct: tv>0?((tv-tc)/tv*100):0 };
}

function renderProgress() {
  const steps = document.getElementById('progress-steps');
  const labels = document.getElementById('progress-labels');
  let sh='', lh='';
  STEPS.forEach((s,i) => {
    const dc = i<current?'done':i===current?'active':'';
    sh += `<div class="p-step"><div class="p-dot ${dc}">${i<current?'✓':(i+1)}</div>${i<STEPS.length-1?`<div class="p-line ${i<current?'done':''}"></div>`:''}</div>`;
    lh += `<div class="p-label ${i===current?'active':''}" style="flex:${i===STEPS.length-1?'0.5':'1'}">${s}</div>`;
  });
  steps.innerHTML = sh; labels.innerHTML = lh;
  document.getElementById('header-cliente').textContent = D.cliente.nombre_comercial || '';
}

function collect() {
  document.querySelectorAll('[data-bind]').forEach(el => {
    const [sec, field] = el.dataset.bind.split('.');
    if(D[sec]!==undefined && typeof D[sec]==='object') D[sec][field]=el.value;
    else D[el.dataset.bind]=el.value;
  });
  document.querySelectorAll('[data-costo]').forEach(el => {
    const i=parseInt(el.dataset.costo); if(D.costos[i]) D.costos[i][el.dataset.col]=el.value;
  });
  document.querySelectorAll('[data-fac]').forEach(el => {
    const i=parseInt(el.dataset.fac); if(D.facturacion[i]) D.facturacion[i][el.dataset.col]=el.value;
  });
}

function nav(dir) { collect(); current=Math.max(0,Math.min(STEPS.length-1,current+dir)); render(); }

function addCosto() { collect(); D.costos.push(newCostoRow()); render(); }
function removeCosto(i) { collect(); D.costos.splice(i,1); if(!D.costos.length) D.costos.push(newCostoRow()); render(); }
function addFac() { collect(); D.facturacion.push(newFacRow()); render(); }
function removeFac(i) { collect(); D.facturacion.splice(i,1); if(!D.facturacion.length) D.facturacion.push(newFacRow()); render(); }

function updateRowMargen(i) {
  const cv=parseFloat(document.querySelector(`[data-costo="${i}"][data-col="venta_unitaria"]`)?.value)||0;
  const cc=parseFloat(document.querySelector(`[data-costo="${i}"][data-col="costo_unitario"]`)?.value)||0;
  const cd=parseFloat(document.querySelector(`[data-costo="${i}"][data-col="dias"]`)?.value)||0;
  const mg=(cv-cc)*cd;
  const el=document.getElementById(`rm-${i}`);
  if(el){ el.textContent=fmt(mg,D.proyecto.moneda); el.style.color=mg>=0?'var(--green)':'var(--danger)'; }
  updateMetrics();
}

function updateMetrics() {
  const rows=[]; document.querySelectorAll('[data-costo]').forEach(el=>{
    const i=parseInt(el.dataset.costo); if(!rows[i]) rows[i]={};
    rows[i][el.dataset.col]=el.value;
  });
  let tv=0,tc=0;
  rows.forEach(r=>{ tv+=(parseFloat(r?.venta_unitaria)||0)*(parseFloat(r?.dias)||0); tc+=(parseFloat(r?.costo_unitario)||0)*(parseFloat(r?.dias)||0); });
  const pct=tv>0?((tv-tc)/tv*100):0;
  const mv=document.getElementById('m-tv'); if(mv) mv.textContent=fmt(tv,D.proyecto.moneda);
  const mc=document.getElementById('m-tc'); if(mc) mc.textContent=fmt(tc,D.proyecto.moneda);
  const mm=document.getElementById('m-mg');
  if(mm){ mm.textContent=pct.toFixed(1)+'%'; mm.className='metric-val '+(pct>=30?'green':pct>0?'':'red'); }
}

function step0() {
  const c=D.cliente;
  return `<div class="step-title">Información del cliente</div>
  <div class="step-sub">Datos fiscales, contactos y proceso de facturación</div>
  <div class="section-card">
    <div class="section-label">Datos fiscales</div>
    <div class="grid grid-2">
      <div class="field"><label>Nombre comercial <span class="req">*</span></label><input data-bind="cliente.nombre_comercial" value="${c.nombre_comercial}" placeholder="Grupo SURMAN"></div>
      <div class="field"><label>Razón social <span class="req">*</span></label><input data-bind="cliente.razon_social" value="${c.razon_social}" placeholder="Razón social completa"></div>
      <div class="field"><label>RFC <span class="req">*</span></label><input data-bind="cliente.rfc" value="${c.rfc}" placeholder="XAXX010101000"></div>
      <div class="field"><label>Localidad</label><select data-bind="cliente.localidad"><option>NACIONAL</option><option ${c.localidad==='INTERNACIONAL'?'selected':''}>INTERNACIONAL</option></select></div>
      <div class="field full"><label>Dirección fiscal</label><input data-bind="cliente.direccion" value="${c.direccion}" placeholder="Calle, Número, Colonia, CP, Ciudad, Estado"></div>
    </div>
  </div>
  <div class="section-card">
    <div class="section-label">Contacto del cliente</div>
    <div class="grid grid-2">
      <div class="field"><label>Líder del proyecto</label><input data-bind="cliente.contacto_lider" value="${c.contacto_lider}" placeholder="Nombre completo"></div>
      <div class="field"><label>Teléfono</label><input data-bind="cliente.telefono1" value="${c.telefono1}" placeholder="55 0000 0000"></div>
      <div class="field full"><label>Correo electrónico</label><input data-bind="cliente.correo1" value="${c.correo1}" placeholder="contacto@empresa.com"></div>
      <div class="field"><label>Contacto Cuentas por Pagar</label><input data-bind="cliente.contacto_cp" value="${c.contacto_cp}" placeholder="Nombre completo"></div>
      <div class="field"><label>Teléfono C×P</label><input data-bind="cliente.telefono2" value="${c.telefono2}" placeholder="55 0000 0000"></div>
      <div class="field full"><label>Correo C×P</label><input data-bind="cliente.correo2" value="${c.correo2}" placeholder="cxp@empresa.com"></div>
    </div>
  </div>
  <div class="section-card">
    <div class="section-label">Facturación y cobranza</div>
    <div class="grid grid-3">
      <div class="field"><label>Solicita ODC</label><select data-bind="cliente.solicita_odc"><option>NO</option><option ${c.solicita_odc==='SI'?'selected':''}>SI</option></select></div>
      <div class="field"><label>Portal web proveedores</label><input data-bind="cliente.portal" value="${c.portal}"></div>
      <div class="field"><label>Contraseña portal</label><input data-bind="cliente.contrasena" value="${c.contrasena}"></div>
      <div class="field full"><label>Proceso de facturación y cobranza</label><textarea data-bind="cliente.proceso_fac">${c.proceso_fac}</textarea></div>
    </div>
  </div>`;
}

function step1() {
  const p=D.proyecto;
  return `<div class="step-title">Información del proyecto</div>
  <div class="step-sub">Datos generales, empresa que factura y tipo de cambio</div>
  <div class="section-card">
    <div class="grid grid-2">
      <div class="field"><label>ID Oportunidad CRM <span class="req">*</span></label><input data-bind="id_op_crm" value="${D.id_op_crm}" placeholder="OP-2026-XXXX"></div>
      <div class="field"><label>¿Existe PEP del cliente?</label><select data-bind="tiene_pep"><option>NO</option><option ${D.tiene_pep==='SI'?'selected':''}>SI</option></select></div>
      <div class="field full"><label>PEP (si aplica)</label><input data-bind="pep" value="${D.pep}" placeholder="Número de PEP"></div>
      <div class="field full"><label>Nombre del proyecto <span class="req">*</span></label><input data-bind="proyecto.nombre" value="${p.nombre}" placeholder="Ej. Implementación S/4HANA Public Cloud — Fase 1"></div>
      <div class="field"><label>Versión</label><input data-bind="proyecto.version" value="${p.version}" placeholder="V1.0"></div>
      <div class="field"><label>Empresa que factura</label><select data-bind="proyecto.empresa">${opt(EMPRESAS,p.empresa)}</select></div>
      <div class="field"><label>Intercompany / Partner con</label><input data-bind="proyecto.intercompany" value="${p.intercompany}" placeholder="Si aplica"></div>
      <div class="field"><label>Responsable COE</label><select data-bind="proyecto.responsable_coe">${opt(RESPONSABLES_COE,p.responsable_coe)}</select></div>
      <div class="field"><label>Fecha inicio</label><input type="date" data-bind="proyecto.fecha_inicio" value="${p.fecha_inicio}"></div>
      <div class="field"><label>Fecha fin</label><input type="date" data-bind="proyecto.fecha_fin" value="${p.fecha_fin}"></div>
      <div class="field"><label>Moneda de venta</label><select data-bind="proyecto.moneda">${opt(MONEDAS,p.moneda)}</select></div>
      <div class="field"><label>TC según contrato (USD)</label><input type="number" data-bind="proyecto.tc_usd" value="${p.tc_usd}" placeholder="18"></div>
    </div>
  </div>`;
}

function step2() {
  const r=D.responsables;
  return `<div class="step-title">Responsables SEIDOR México</div>
  <div class="step-sub">Equipo interno asignado al deal</div>
  <div class="section-card">
    <div class="grid grid-2">
      <div class="field"><label>Director General</label><input data-bind="responsables.director" value="${r.director}" readonly style="background:#f0efe8; color:var(--muted)"></div>
      <div class="field"><label>Director de Operaciones <span class="req">*</span></label><select data-bind="responsables.dir_ops">${opt(DIR_OPS,r.dir_ops)}</select></div>
      <div class="field"><label>Gerente BU <span class="req">*</span></label><select data-bind="responsables.gerente">${opt(GERENTES,r.gerente)}</select></div>
      <div class="field"><label>División comercial BU <span class="req">*</span></label><select data-bind="responsables.division">${opt(DIVISIONES,r.division)}</select></div>
      <div class="field full"><label>Ejecutivo comercial <span class="req">*</span></label><select data-bind="responsables.ejecutivo">${opt(EJECUTIVOS,r.ejecutivo)}</select></div>
    </div>
  </div>`;
}

function step3() {
  const t=calcTotals();
  const colorClass=t.pct>=30?'green':t.pct>0?'':'red';
  let costoRows=D.costos.map((r,i)=>`
    <div class="tbl-row cols-costo">
      <input data-costo="${i}" data-col="concepto" value="${r.concepto}" placeholder="Descripción del servicio" oninput="">
      <input type="number" data-costo="${i}" data-col="costo_unitario" value="${r.costo_unitario}" placeholder="0.00" oninput="updateRowMargen(${i})">
      <input type="number" data-costo="${i}" data-col="venta_unitaria" value="${r.venta_unitaria}" placeholder="0.00" oninput="updateRowMargen(${i})">
      <input type="number" data-costo="${i}" data-col="dias" value="${r.dias}" placeholder="días" oninput="updateRowMargen(${i})">
      <span class="row-margen" id="rm-${i}" style="color:${(parseFloat(r.venta_unitaria)-parseFloat(r.costo_unitario))*(parseFloat(r.dias)||0)>=0?'var(--green)':'var(--danger)'}">${fmt((parseFloat(r.venta_unitaria)-parseFloat(r.costo_unitario))*(parseFloat(r.dias)||0),D.proyecto.moneda)}</span>
      <button class="btn-remove" onclick="removeCosto(${i})" title="Eliminar">×</button>
    </div>`).join('');

  return `<div class="step-title">Costos y márgenes</div>
  <div class="step-sub">Detalle de conceptos, precios y cálculo automático de margen</div>
  <div class="metrics">
    <div class="metric"><div class="metric-label">Total venta</div><div class="metric-val" id="m-tv">${fmt(t.tv,D.proyecto.moneda)}</div></div>
    <div class="metric"><div class="metric-label">Total costo</div><div class="metric-val" id="m-tc">${fmt(t.tc,D.proyecto.moneda)}</div></div>
    <div class="metric"><div class="metric-label">% Margen</div><div class="metric-val ${colorClass}" id="m-mg">${t.pct.toFixed(1)}%</div></div>
  </div>
  <div class="section-card">
    <div class="tbl-header cols-costo">
      <span class="tbl-label">Concepto</span>
      <span class="tbl-label">Costo unitario</span>
      <span class="tbl-label">Venta unitaria</span>
      <span class="tbl-label">Días / Uds.</span>
      <span class="tbl-label">Margen</span>
      <span></span>
    </div>
    <div id="costo-rows">${costoRows}</div>
    <button class="btn-add" onclick="addCosto()">+ Agregar concepto</button>
  </div>
  <div class="section-card">
    <div class="section-label">EBM — Aliado comercial <span class="badge-opt">Solo si aplica</span></div>
    <div class="grid grid-3">
      <div class="field"><label>¿Hay EBM?</label><select data-bind="ebm.hay_ebm" onchange="collect()"><option>NO</option><option ${D.ebm.hay_ebm==='SI'?'selected':''}>SI</option></select></div>
      <div class="field"><label>Razón social EBM</label><input data-bind="ebm.razon_social" value="${D.ebm.razon_social}"></div>
      <div class="field"><label>% Comisión</label><input type="number" data-bind="ebm.pct_comision" value="${D.ebm.pct_comision}" placeholder="0.00"></div>
    </div>
  </div>`;
}

function step4() {
  let facRows=D.facturacion.map((r,i)=>`
    <div class="hito-card">
      <div class="hito-header"><span class="hito-num">Hito ${i+1}</span><button class="btn-remove" onclick="removeFac(${i})">×</button></div>
      <div class="grid grid-2">
        <div class="field full"><label>Descripción de la factura</label><input data-fac="${i}" data-col="descripcion" value="${r.descripcion}" placeholder="Ej. Anticipo — inicio de proyecto"></div>
        <div class="field full"><label>Tipo</label><select data-fac="${i}" data-col="tipo">${opt(TIPOS_FAC,r.tipo)}</select></div>
        <div class="field"><label>Moneda</label><select data-fac="${i}" data-col="moneda">${opt(MONEDAS,r.moneda)}</select></div>
        <div class="field"><label>Importe</label><input type="number" data-fac="${i}" data-col="importe" value="${r.importe}" placeholder="0.00"></div>
        <div class="field"><label>Fecha factura</label><input type="date" data-fac="${i}" data-col="fecha" value="${r.fecha}"></div>
        <div class="field"><label>Recurrencia</label><select data-fac="${i}" data-col="recurrencia">${opt(RECURRENCIA,r.recurrencia)}</select></div>
        <div class="field"><label>Condición de pago</label><select data-fac="${i}" data-col="cond_pago">${opt(COND_PAGO,r.cond_pago)}</select></div>
        <div class="field"><label>División</label><select data-fac="${i}" data-col="division">${opt(DIVISIONES,r.division)}</select></div>
      </div>
    </div>`).join('');

  return `<div class="step-title">Esquema de facturación</div>
  <div class="step-sub">Hitos, importes, fechas y condiciones de pago</div>
  <div id="fac-rows">${facRows}</div>
  <button class="btn-add" onclick="addFac()">+ Agregar hito de facturación</button>
  <div class="section-card" style="margin-top:16px;">
    <div class="section-label">Observaciones de facturación y envío</div>
    <textarea data-bind="obs_fac" style="width:100%;">${D.obs_fac||''}</textarea>
  </div>`;
}

function step5() {
  const t=calcTotals();
  const colorClass=t.pct>=30?'green':t.pct>0?'':'red';
  return `<div class="step-title">Resumen</div>
  <div class="step-sub">Revisa la información y genera el Excel para Finanzas</div>
  <div class="notice"><strong>Todo listo.</strong> Al hacer clic en "Generar Excel", se descargará el archivo .xlsx directamente en tu computadora.</div>
  <div class="section-card">
    <div class="section-label">Cliente</div>
    <div class="summary-row"><span class="summary-key">Nombre comercial</span><span class="summary-val">${D.cliente.nombre_comercial||'—'}</span></div>
    <div class="summary-row"><span class="summary-key">RFC</span><span class="summary-val">${D.cliente.rfc||'—'}</span></div>
    <div class="summary-row"><span class="summary-key">Localidad</span><span class="summary-val">${D.cliente.localidad}</span></div>
    <div class="summary-row"><span class="summary-key">Líder del proyecto</span><span class="summary-val">${D.cliente.contacto_lider||'—'}</span></div>
    <div class="summary-row"><span class="summary-key">Correo</span><span class="summary-val">${D.cliente.correo1||'—'}</span></div>
  </div>
  <div class="section-card">
    <div class="section-label">Proyecto</div>
    <div class="summary-row"><span class="summary-key">Nombre</span><span class="summary-val">${D.proyecto.nombre||'—'}</span></div>
    <div class="summary-row"><span class="summary-key">Empresa que factura</span><span class="summary-val">${D.proyecto.empresa}</span></div>
    <div class="summary-row"><span class="summary-key">Fechas</span><span class="summary-val">${D.proyecto.fecha_inicio||'—'} → ${D.proyecto.fecha_fin||'—'}</span></div>
    <div class="summary-row"><span class="summary-key">Moneda</span><span class="summary-val">${D.proyecto.moneda} (TC: ${D.proyecto.tc_usd})</span></div>
  </div>
  <div class="section-card">
    <div class="section-label">Responsables</div>
    <div class="summary-row"><span class="summary-key">Ejecutivo</span><span class="summary-val">${D.responsables.ejecutivo||'—'}</span></div>
    <div class="summary-row"><span class="summary-key">Gerente BU</span><span class="summary-val">${D.responsables.gerente||'—'}</span></div>
    <div class="summary-row"><span class="summary-key">División</span><span class="summary-val">${D.responsables.division||'—'}</span></div>
  </div>
  <div class="metrics">
    <div class="metric"><div class="metric-label">Total venta</div><div class="metric-val">${fmt(t.tv,D.proyecto.moneda)}</div></div>
    <div class="metric"><div class="metric-label">Total costo</div><div class="metric-val">${fmt(t.tc,D.proyecto.moneda)}</div></div>
    <div class="metric"><div class="metric-label">% Margen</div><div class="metric-val ${colorClass}">${t.pct.toFixed(1)}%</div></div>
  </div>
  <div style="text-align:center; padding: 8px 0 4px;">
    <button class="btn btn-export" onclick="generateExcel()">⬇ Generar Excel</button>
  </div>`;
}

function render() {
  renderProgress();
  const fns=[step0,step1,step2,step3,step4,step5];
  document.getElementById('step-content').innerHTML = fns[current]() + `
    <div class="nav-bar">
      <button class="btn" onclick="nav(-1)" ${current===0?'disabled':''}>← Anterior</button>
      <span class="step-counter">${current+1} de ${STEPS.length}</span>
      ${current<STEPS.length-1?`<button class="btn btn-primary" onclick="nav(1)">Siguiente →</button>`:`<div></div>`}
    </div>`;
}

function generateExcel() {
  collect();
  const t = calcTotals();
  const wb = XLSX.utils.book_new();

  // ── HOJA PRINCIPAL ──────────────────────────────────────────
  const ws_data = [
    ['FORMATO DE ALTA 2026', '', '', '', '', '', '', '', '', '', '', '', '', '', '', 'Fecha', new Date()],
    [],
    ['', '', 'INFORMACIÓN FISCAL DEL CLIENTE', '', '', '', '', '', 'INFORMACIÓN DEL PROYECTO', '', '', '', '', '', '', 'ID OP_CRM', D.id_op_crm],
    ['', '', 'NOMBRE COMERCIAL', D.cliente.nombre_comercial, '', '', '', '', 'NOMBRE DEL PROYECTO', D.proyecto.nombre, '', '', '', '', '', '¿EXISTE PEP DEL CLIENTE?', D.tiene_pep],
    ['', '', 'RAZÓN SOCIAL', D.cliente.razon_social, '', '', '', '', 'VERSIÓN', D.proyecto.version, '', '', '', '', '', 'PEP', D.pep],
    ['', '', 'RFC', D.cliente.rfc, '', '', '', '', 'FECHA DE INICIO DE PROYECTO', D.proyecto.fecha_inicio],
    ['', '', 'DIRECCIÓN FISCAL', D.cliente.direccion, '', '', '', '', 'FECHA FINAL DE PROYECTO', D.proyecto.fecha_fin, '', '', '', '', '', 'TC SEGÚN CONTRATO (USD)', D.proyecto.tc_usd, 'TC REFEREN (MXN)', D.proyecto.tc_ref],
    ['', '', 'LOCALIDAD', D.cliente.localidad, '', '', '', '', 'EMPRESA QUE FACTURA', D.proyecto.empresa, '', '', '', '', '', '', '', '18', '1'],
    ['', '', '', '', '', '', '', '', 'INTERCOMPANY/PARTNER CON', D.proyecto.intercompany],
    ['', '', '', '', '', '', '', '', 'NOMBRE DEL RESPONSABLE (COE)', D.proyecto.responsable_coe, '', '', '', '', '', 'MONEDA DE VENTA'],
    ['', '', 'INFORMACIÓN DEL CONTACTO - CLIENTE', '', '', '', '', '', '', '', '', '', '', '', '', D.proyecto.moneda],
    ['', '', 'LÍDER DEL PROYECTO', D.cliente.contacto_lider, '', '', '', '', 'SOLUCIONES Y/O PRODUCTOS INCLUIDOS EN EL PROYECTO'],
    ['', '', 'TELÉFONO', D.cliente.telefono1, '', 'CORREO', D.cliente.correo1, '', 'MARCA CON X SEGÚN CORRESPONDA'],
    ['', '', 'CONTACTO CUENTAS POR PAGAR', D.cliente.contacto_cp, '', '', '', '', 'LICEN SAP (Venta de Licencias)', '', 'ANUAL (Mantenimiento)', '', '', '', '', 'VENTA TOTAL SIN MTTO'],
    ['', '', 'TELÉFONO', D.cliente.telefono2, '', 'CORREO', D.cliente.correo2, '', 'SUSC. SAP (Venta de Susc.)', '', 'SUSC. CCFLEX INCLUYE:', '', '', '', '', 'USD', 'MXN'],
    ['', '', '', '', '', '', '', '', 'HOSTING (AWS, AZURE, SKYONE, HUAWEI)', '', '', '', '', '', '', t.tv, t.tv * parseFloat(D.proyecto.tc_usd||18)],
    [],
    ['', '', 'INFORMACIÓN FACTURACIÓN - CLIENTE'],
    ['', '', 'SOLICTA ODC', D.cliente.solicita_odc, '', '', '', '', 'INFORMACIÓN RESPONSABLES DE SEIDOR MEXICO', '', '', '', '', '', '', 'COSTO TOTAL SIN MTTO'],
    ['', '', 'PORTAL WEB DE PROVEEDORES', D.cliente.portal, '', '', '', '', 'DIRECTOR GENERAL', D.responsables.director, '', '', '', '', '', 'USD', 'MXN'],
    ['', '', 'CONTRASEÑA', D.cliente.contrasena, '', '', '', '', 'DIRECTOR DE OPERACIONES', D.responsables.dir_ops, '', '', '', '', '', t.tc, t.tc * parseFloat(D.proyecto.tc_usd||18)],
    ['', '', 'EXPLICA EL PROCESO DE FACTURACIÓN Y COBRANZA', '', '', '', '', '', 'GERENTE BU', D.responsables.gerente],
    ['', '', D.cliente.proceso_fac, '', '', '', '', '', 'DIVISIÓN COMERCIAL BU', D.responsables.division],
    ['', '', '', '', '', '', '', '', 'EJECUTIVO COMERCIAL', D.responsables.ejecutivo],
    ['', '', '', '', '', '', '', '', '', '', '', '', '', '', '', 'MARGEN TOTAL'],
    ['', '', '', '', '', '', '', '', '', '', '', '', '', '', '', 'USD', 'MXN'],
    ['', '', '', '', '', '', '', '', '', '', '', '', '', '', '', t.mg, t.mg * parseFloat(D.proyecto.tc_usd||18)],
    ['', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', (t.tv>0?(t.mg/t.tv*100).toFixed(1)+'%':'#DIV/0!')],
    [],
    ['', 'CÁLCULO DE COSTOS Y MARGEN DEL PROYECTO'],
    ['', 'CONCEPTO', '', '', '', '', '', '', 'COSTO UNITARIO', '', 'VENTA UNITARIA', '', '', 'DÍAS / UNIDADES', '', '', 'TOTAL COSTO', 'TOTAL VENTA', '', '', '', '', '', 'MARGEN FINAL', '', '% MARGEN'],
    ...D.costos.map((r,i) => {
      const cu=parseFloat(r.costo_unitario)||0, vu=parseFloat(r.venta_unitaria)||0, d=parseFloat(r.dias)||0;
      return ['',(i+1),r.concepto,'','','','','',cu,'',vu,'','',d,'','',cu*d,vu*d,'','','','','',vu*d-cu*d,'',(vu>0?(((vu-cu)/vu)*100).toFixed(1)+'%':'')];
    }),
    ['','MONTO TOTAL VENTA','','','','','','',t.tv/D.costos.length||0,'',t.tv/D.costos.length||0,'','','','','',t.tc,t.tv,'','','','','',t.mg,'',t.tv>0?(t.mg/t.tv*100).toFixed(1)+'%':''],
    [],
    ['','SOLO SÍ APLICA*          DATOS EBM (ALIADO COMERCIAL)'],
    ['','HAY EBM EN EL PROYECTO','',D.ebm.hay_ebm],
    ['','RAZÓN SOCIAL EBM',D.ebm.razon_social],
    ['','PORCENTAJE COMISIÓN',D.ebm.pct_comision+'%'],
    [],
    ['','FACTURACIÓN'],
    ['','DESCRIPCIÓN DE LA FACTURA','','','TIPO','','DIVISIÓN','NO. CUOTAS','MONEDA','IMPORTE','','% VENTA','','FECHA FACTURA','','RECURRENCIA','COND. DE PAGO'],
    ...D.facturacion.map((r,i) => {
      const imp=parseFloat(r.importe)||0;
      const pct=t.tv>0?(imp/t.tv*100).toFixed(1)+'%':'';
      return ['',(i+1),r.descripcion,'',r.tipo,'',r.division,1,r.moneda,imp,'',pct,'',r.fecha,'',r.recurrencia,r.cond_pago];
    }),
    [],
    ['','OBSERVACIONES DE FACTURACIÓN Y ENVÍO'],
    ['',D.obs_fac||'']
  ];

  const ws = XLSX.utils.aoa_to_sheet(ws_data);

  // Column widths
  ws['!cols'] = [
    {wch:2},{wch:4},{wch:40},{wch:30},{wch:10},{wch:10},{wch:30},{wch:10},
    {wch:35},{wch:30},{wch:20},{wch:10},{wch:10},{wch:12},{wch:10},{wch:18},{wch:18}
  ];

  XLSX.utils.book_append_sheet(wb, ws, 'SALES');

  // ── HOJA RESUMEN EJECUTIVO ───────────────────────────────────
  const ws2_data = [
    ['RESUMEN EJECUTIVO — FORMATO DE ALTA'],
    [],
    ['Fecha de llenado', new Date().toLocaleDateString('es-MX')],
    ['ID Oportunidad CRM', D.id_op_crm],
    [],
    ['DATOS DEL CLIENTE'],
    ['Nombre comercial', D.cliente.nombre_comercial],
    ['Razón social', D.cliente.razon_social],
    ['RFC', D.cliente.rfc],
    ['Localidad', D.cliente.localidad],
    [],
    ['DATOS DEL PROYECTO'],
    ['Nombre del proyecto', D.proyecto.nombre],
    ['Empresa que factura', D.proyecto.empresa],
    ['Moneda', D.proyecto.moneda],
    ['Fecha inicio', D.proyecto.fecha_inicio],
    ['Fecha fin', D.proyecto.fecha_fin],
    [],
    ['RESPONSABLES'],
    ['Director General', D.responsables.director],
    ['Director de Operaciones', D.responsables.dir_ops],
    ['Gerente BU', D.responsables.gerente],
    ['División', D.responsables.division],
    ['Ejecutivo comercial', D.responsables.ejecutivo],
    [],
    ['RESUMEN FINANCIERO'],
    ['Total venta ('+D.proyecto.moneda+')', t.tv],
    ['Total costo ('+D.proyecto.moneda+')', t.tc],
    ['Margen ('+D.proyecto.moneda+')', t.mg],
    ['% Margen', t.tv>0?(t.mg/t.tv*100).toFixed(1)+'%':'N/A'],
    [],
    ['HITOS DE FACTURACIÓN'],
    ['#','Descripción','Moneda','Importe','Fecha','Recurrencia','Cond. Pago'],
    ...D.facturacion.map((r,i)=>[(i+1),r.descripcion,r.moneda,parseFloat(r.importe)||0,r.fecha,r.recurrencia,r.cond_pago])
  ];
  const ws2 = XLSX.utils.aoa_to_sheet(ws2_data);
  ws2['!cols']=[{wch:30},{wch:45},{wch:15},{wch:15},{wch:15},{wch:20},{wch:20}];
  XLSX.utils.book_append_sheet(wb, ws2, 'RESUMEN');

  const cliente_safe = (D.cliente.nombre_comercial||'cliente').replace(/[^a-zA-Z0-9]/g,'_');
  XLSX.writeFile(wb, `FormatoAlta_${cliente_safe}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

render();
</script>
</body>
</html>
